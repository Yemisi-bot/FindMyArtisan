# FindMyArtisan — self-contained local stack.
#
#   ./start_local.sh          build and start everything
#   docker compose down       stop
#   docker compose down -v    stop and wipe the database
#
# Nothing here touches the deployed Render services or the Neon database.
# Everything runs on this machine.

name: findmyartisan

services:
  # ── PostgreSQL with PostGIS ────────────────────────────────────────────────
  # Must be the postgis image, not plain postgres: the schema runs
  # CREATE EXTENSION postgis and stores locations as geography(Point).
  db:
    # Multi-arch (amd64 + arm64) PostGIS build, so this runs natively on Apple
    # Silicon rather than under emulation. The official postgis/postgis image is
    # amd64-only; swap to it if you prefer, at the cost of a slow emulated DB.
    image: imresamu/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: findmyartisan
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: findmyartisan
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1 forces a TCP check. Without it, pg_isready answers over the
      # unix socket and reports ready during initdb's temporary socket-only
      # server — so on a first run the API connects, gets ECONNREFUSED on TCP,
      # and crash-loops. Checking TCP is what the API actually uses.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U findmyartisan -d findmyartisan"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  # ── Express API ────────────────────────────────────────────────────────────
  api:
    build:
      context: ../backend
      dockerfile: ../local/Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: postgresql://findmyartisan:localdev@db:5432/findmyartisan

      # The browser only ever talks to nginx on :3000, so that is the origin
      # the API must allow. Localhost:5173 is included so a Vite dev server
      # can also talk to this API while the stack is running.
      CLIENT_URL: http://localhost:3000,http://localhost:5173

      # Local-only credentials. These never leave this machine.
      JWT_SECRET: local-development-only-not-a-real-secret-0123456789
      JWT_EXPIRES_IN: 24h
      ADMIN_EMAIL: admin@findmyartisan.com
      ADMIN_PASSWORD: admin123
      ADMIN_NAME: Local Admin

      # Ten demo artisans around Ilaro, each with three work photos, so search
      # returns results the moment the stack comes up.
      SEED_SAMPLE_DATA: "true"

      DEFAULT_SEARCH_RADIUS: "5"
      MAX_SEARCH_RADIUS: "25"

      # CLOUDINARY_URL is intentionally unset: uploads fall back to disk at
      # UPLOAD_DIR. Set it in .env to use a real Cloudinary account instead.
      UPLOAD_DIR: /data/uploads
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    volumes:
      - uploads:/data/uploads
    ports:
      # Published so you can curl the API directly while debugging. The app
      # itself reaches it through nginx, not this port.
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5001/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      # Generous: a first run creates the schema, both extensions and the demo
      # data before the server starts listening.
      start_period: 90s
    restart: unless-stopped

  # ── Frontend (nginx) ───────────────────────────────────────────────────────
  web:
    build:
      context: ../frontend
      dockerfile: ../local/Dockerfile.web
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  uploads:
