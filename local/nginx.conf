server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images are served by the API when Cloudinary is not configured.
    # Cloudinary URLs are absolute and never reach nginx.
    location /uploads/ {
        proxy_pass http://api:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything under /api goes to the Express container. Because the browser
    # only ever talks to this one origin, CORS never comes into play locally.
    location /api/ {
        proxy_pass http://api:5001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Image uploads can be 25 MB per file, six at a time.
        client_max_body_size 160m;
        proxy_read_timeout   300s;
        proxy_send_timeout   300s;
    }

    # Cache-bust-safe: hashed assets can be cached hard, index.html never.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA fallback — react-router owns the URL, so any unknown path must still
    # return index.html. Without this, refreshing on /discover returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
