[service]
name = "findmyartisan-web"

[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npx vite preview --host 0.0.0.0 --port ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 15
restartPolicyType = "ON_FAILURE"

# ── Environment variables ─────────────────────────────────────────────
[deploy.env]
# Point to your backend API (Railway will give you a public URL)
# Set this in the Railway dashboard to the backend's URL:
#   VITE_API_URL = https://findmyartisan-api.up.railway.app/api

# NODE_ENV is set automatically by the NIXPACKS builder
