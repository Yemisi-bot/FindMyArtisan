# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy order matters: the API must exist before the web build runs, because
# Vite inlines VITE_API_URL into the bundle at BUILD time (not at runtime).
#
# Secrets are marked `sync: false` — Render prompts for them on first deploy
# and they are never committed here. Set them in the dashboard:
#   DATABASE_URL   Neon pooled connection string, must end with ?sslmode=require
#   JWT_SECRET     long random string
#   CLOUDINARY_URL cloudinary://<api_key>:<api_secret>@<cloud_name>
#   BREVO_API_KEY  transactional email key (optional — OTPs log to console without it)

services:
  # ── API ────────────────────────────────────────────────────────────────
  - type: web
    name: findmyartisan-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev is required: NODE_ENV=production makes npm omit
    # devDependencies, and typescript/@types live there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DEFAULT_SEARCH_RADIUS
        value: "5"
      - key: MAX_SEARCH_RADIUS
        value: "25"
      - key: SEED_SAMPLE_DATA
        value: "false"
      - key: EMAIL_FROM_NAME
        value: FindMyArtisan
      # CORS origin — the static site's full URL, e.g.
      # https://findmyartisan-web.onrender.com  (exact match, NO trailing slash)
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false

  # ── Web (static SPA) ───────────────────────────────────────────────────
  # Static sites are free and never spin down, unlike free web services.
  - type: web
    name: findmyartisan-web
    runtime: static
    rootDir: frontend
    # --include=dev is required: NODE_ENV=production makes npm omit
    # devDependencies, and typescript/@types live there.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_APP_NAME
        value: FindMyArtisan
      - key: VITE_DEFAULT_RADIUS
        value: "5"
      - key: VITE_MAX_RADIUS
        value: "25"
      # Baked into the bundle at build time. Must include the /api suffix.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA fallback — every non-asset path serves index.html so react-router works
      - type: rewrite
        source: /*
        destination: /index.html
